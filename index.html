<title>Owen Ashcroft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ededed;
    --card:#ffffff;
    --text:#0a0a0a;
    --line:#dcdcdc;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#ededed;
      --card:#ffffff;
      --text:#0a0a0a;
      --line:#dcdcdc;
    }
  }
  :root[data-theme="dark"]{
    --bg:#ededed;
    --card:#ffffff;
    --text:#0a0a0a;
    --line:#dcdcdc;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Funnel Sans","Funnel Sans Placeholder",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  .page{
    display:flex;
    gap:10px;
    padding:20px;
    min-height:100%;
  }
  @media (min-width:860px){
    .page{height:100vh;}
  }

  /* ---------- left column ---------- */
  .sidebar{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    flex-shrink:0;
  }
  @media (min-width:860px){
    .sidebar{width:min(32vw,440px);height:100%;}
  }

  .topbar{
    background:var(--card);
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:0 0 auto;
  }
  .topbar .status{
    font-size:13px;
    letter-spacing:.02em;
    text-transform:uppercase;
    font-variant-numeric:tabular-nums;
  }
  .topbar nav{
    display:flex;
    gap:22px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .topbar nav a{
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .maincard{
    background:var(--card);
    padding:30px;
    display:flex;
    flex-direction:column;
    gap:18px;
    flex:1 1 auto;
  }
  .portrait{
    width:clamp(150px,22vw,220px);
    aspect-ratio:1/1;
    overflow:hidden;
    background:#111;
  }
  .portrait img{width:100%;height:100%;object-fit:cover;}

  h1.name{
    margin:0;
    font-weight:300;
    text-transform:uppercase;
    font-size:clamp(34px,4.6vw,64px);
    line-height:0.92;
    letter-spacing:-0.04em;
  }
  .desc{
    margin:0;
    max-width:34ch;
    font-size:14px;
    line-height:1.4;
    text-transform:uppercase;
    letter-spacing:0;
  }
  .avail{
    font-size:15px;
    text-transform:uppercase;
    text-decoration:underline;
    text-underline-offset:3px;
    width:fit-content;
  }

  .socialbar{
    background:var(--card);
    padding:20px;
    display:flex;
    gap:26px;
    flex-wrap:wrap;
    flex:0 0 auto;
  }
  .socialbar a{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  /* ---------- right column ---------- */
  .workpanel{
    background:var(--card);
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  @media (min-width:860px){
    .workpanel{height:100%;overflow:hidden;}
  }
  .works-heading{
    margin:0;
    padding:30px 30px 16px;
    font-weight:400;
    text-transform:uppercase;
    font-size:28px;
    letter-spacing:-0.04em;
    flex:0 0 auto;
  }
  .gallery{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:0 20px 20px;
    overflow-y:auto;
    flex:1 1 auto;
    scrollbar-width:thin;
  }
  .gallery-col{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .gallery-col figure{
    margin:0;
    overflow:hidden;
    background:#eee;
  }
  .gallery-col img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .5s ease;
  }
  .gallery-col figure:hover img{
    transform:scale(1.04);
  }

  @media (max-width:859px){
    .page{flex-direction:column;}
    .gallery{overflow-y:visible;}
  }
</style>

<div class="page">
  <aside class="sidebar">
    <header class="topbar">
      <div class="status"><span id="city">New York</span> · <span id="clock">—</span></div>
      <nav>
        <a href="#" onclick="return false;">Info</a>
        <a href="#" onclick="return false;">Contact</a>
      </nav>
    </header>

    <section class="maincard">
      <div class="portrait">
        <img src="images/portrait.png" alt="Schwarz-weiß Portrait von Owen Ashcroft, Marken- und Verpackungsdesigner aus New York">
      </div>
      <h1 class="name">Owen<br>Ashcroft</h1>
      <p class="desc">A designer working across brand and packaging — building considered, lasting work for modern companies. Based in New York.</p>
      <a class="avail" href="#" onclick="return false;">Available for work →</a>
    </section>

    <footer class="socialbar">
      <a href="https://x.com/kadircalik" target="_blank" rel="noopener">Twitter (X)</a>
      <a href="https://linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
    </footer>
  </aside>

  <main class="workpanel">
    <h2 class="works-heading">Works</h2>
    <div class="gallery">
      <div class="gallery-col">
        <figure style="aspect-ratio:900/606"><img src="images/c1-1.jpg" alt="Cremefarbene Konfektboxen auf einem Tisch mit weichem Fensterlicht-Schatten" loading="lazy"></figure>
        <figure style="aspect-ratio:3/4"><img src="images/c1-2.webp" alt="Hand hält eine dunkle Flasche und ein Coupe-Glas vor grünem Samt" loading="lazy"></figure>
        <figure style="aspect-ratio:3/4"><img src="images/c1-3.webp" alt="Illustrierter Pappbecher auf einem gelb gefliesten Tisch neben einem Kaktus" loading="lazy"></figure>
        <figure style="aspect-ratio:3/4"><img src="images/c1-4.webp" alt="Kerze und Box auf dunklem Samt mit warm brennender Flamme" loading="lazy"></figure>
        <figure style="aspect-ratio:680/906"><img src="images/c1-5.webp" alt="Grüner, goldgeprägter Ordner auf einem Silbertablett über geripptem Stoff" loading="lazy"></figure>
        <figure style="aspect-ratio:3/4"><img src="images/c1-6.webp" alt="Weiße Dosen mit fließender schwarzer Schrift vor dunklem Hintergrund" loading="lazy"></figure>
      </div>
      <div class="gallery-col">
        <figure style="aspect-ratio:3/4"><img src="images/c2-1.webp" alt="Gestapelte gemusterte Boxen vor einer orangefarbenen Art-déco-Fliesenwand" loading="lazy"></figure>
        <figure style="aspect-ratio:3/4"><img src="images/c2-2.webp" alt="Runde Dose mit Porträtdruck-Deckel auf Marmorfliesenboden" loading="lazy"></figure>
        <figure style="aspect-ratio:3/4"><img src="images/c2-3.webp" alt="Silbern geprägte Kosmetikbox mit geprägtem Flaschendetail" loading="lazy"></figure>
        <figure style="aspect-ratio:3/4"><img src="images/c2-4.webp" alt="Papiertuben mit kräftigem grün-orangem Scherenschnitt-Muster" loading="lazy"></figure>
        <figure style="aspect-ratio:3/4"><img src="images/c2-5.webp" alt="Gemusterte Tragebox vor rotem gemustertem Hintergrund gehalten" loading="lazy"></figure>
        <figure style="aspect-ratio:900/600"><img src="images/c2-6.webp" alt="Cremefarbene Papiertragetasche mit goldenem Schriftzug und hartem Schatten" loading="lazy"></figure>
      </div>
    </div>
  </main>
</div>

<script>
  function updateClock(){
    try{
      const fmt = new Intl.DateTimeFormat('en-US',{
        timeZone:'America/New_York',
        hour:'numeric',
        minute:'2-digit',
        hour12:true
      });
      document.getElementById('clock').textContent = fmt.format(new Date());
    }catch(e){}
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
