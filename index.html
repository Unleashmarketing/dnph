<title>Dung Nguyen Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ededed;
    --card:#ffffff;
    --text:#0a0a0a;
    --line:#dcdcdc;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#ededed;
      --card:#ffffff;
      --text:#0a0a0a;
      --line:#dcdcdc;
    }
  }
  :root[data-theme="dark"]{
    --bg:#ededed;
    --card:#ffffff;
    --text:#0a0a0a;
    --line:#dcdcdc;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Funnel Sans","Funnel Sans Placeholder",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  .page{
    display:flex;
    gap:10px;
    padding:20px;
    min-height:100%;
  }
  @media (min-width:860px){
    .page{height:100vh;}
  }

  /* ---------- left column ---------- */
  .sidebar{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    flex-shrink:0;
  }
  @media (min-width:860px){
    .sidebar{width:min(32vw,440px);height:100%;}
  }

  .topbar{
    background:var(--card);
    padding:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:0 0 auto;
  }
  .topbar .status{
    font-size:13px;
    letter-spacing:.02em;
    text-transform:uppercase;
    font-variant-numeric:tabular-nums;
  }
  .topbar nav{
    display:flex;
    gap:22px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .topbar nav a{
    text-decoration:underline;
    text-underline-offset:3px;
  }

  .maincard{
    background:var(--card);
    padding:30px;
    display:flex;
    flex-direction:column;
    gap:18px;
    flex:1 1 auto;
  }
  .portrait{
    width:clamp(150px,22vw,220px);
    aspect-ratio:1/1;
    overflow:hidden;
    background:#111;
  }
  .portrait img{width:100%;height:100%;object-fit:cover;}

  h1.name{
    margin:0;
    font-weight:300;
    text-transform:uppercase;
    font-size:clamp(34px,4.6vw,64px);
    line-height:0.92;
    letter-spacing:-0.04em;
  }
  .desc{
    margin:0;
    max-width:34ch;
    font-size:14px;
    line-height:1.4;
    text-transform:uppercase;
    letter-spacing:0;
  }
  .avail{
    font-size:15px;
    text-transform:uppercase;
    text-decoration:underline;
    text-underline-offset:3px;
    width:fit-content;
  }

  .socialbar{
    background:var(--card);
    padding:20px;
    display:flex;
    gap:26px;
    flex-wrap:wrap;
    flex:0 0 auto;
  }
  .socialbar a{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-decoration:underline;
    text-underline-offset:3px;
  }

  /* ---------- right column ---------- */
  .workpanel{
    background:var(--card);
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  @media (min-width:860px){
    .workpanel{height:100%;overflow:hidden;}
  }
  .works-heading{
    margin:0;
    padding:30px 30px 16px;
    font-weight:400;
    text-transform:uppercase;
    font-size:28px;
    letter-spacing:-0.04em;
    flex:0 0 auto;
  }
  .gallery{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:0 20px 20px;
    overflow-y:auto;
    flex:1 1 auto;
    scrollbar-width:thin;
  }
  .gallery-col{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .gallery-col figure{
    margin:0;
    overflow:hidden;
    background:#eee;
  }
  .gallery-col img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .5s ease;
  }
  .gallery-col figure:hover img{
    transform:scale(1.04);
  }

  @media (max-width:859px){
    .page{flex-direction:column;}
    .gallery{overflow-y:visible;}
  }
</style>

<script>
  function updateClock(){
    try{
      const fmt = new Intl.DateTimeFormat('de-DE',{
        timeZone:'Europe/Berlin',
        hour:'numeric',
        minute:'2-digit',
        hour12:false
      });
      document.getElementById('clock').textContent = fmt.format(new Date());
    }catch(e){}
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
